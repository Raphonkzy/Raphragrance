apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raphragrance
  namespace: default
  labels:
    app: raphragrance
    app.kubernetes.io/name: raphragrance
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  tls:
    - hosts:
        - raphragrance.com
        - www.raphragrance.com
      secretName: raphragrance-tls
  rules:
    - host: raphragrance.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: raphragrance
                port:
                  number: 80
    - host: www.raphragrance.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: raphragrance
                port:
                  number: 80
