apiVersion: v1
kind: ConfigMap
metadata:
  name: raphragrance-config
  namespace: default
  labels:
    app: raphragrance
    app.kubernetes.io/name: raphragrance
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "3000"
  DATABASE_PATH: "/app/data/perfumes.public.db"
  INCLUDE_COMMUNITY_EDGES: "false"
  ALLOW_FULL_DB_IN_PROD: "false"
  NEXT_PUBLIC_SITE_URL: "https://raphragrance.com"
