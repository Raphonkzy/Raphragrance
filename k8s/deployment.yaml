apiVersion: apps/v1
kind: Deployment
metadata:
  name: raphragrance
  namespace: default
  labels:
    app: raphragrance
    app.kubernetes.io/name: raphragrance
    app.kubernetes.io/component: app
    app.kubernetes.io/version: "latest"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: raphragrance
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: raphragrance
        app.kubernetes.io/name: raphragrance
    spec:
      # ── Security Context (Pod-level) ───────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      # ── Topology spread for HA across nodes ───────────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: raphragrance

      containers:
        - name: raphragrance
          image: raphragrance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Security Context (Container-level) ──────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Gunicorn needs /tmp for worker files
            capabilities:
              drop: ["ALL"]

          # ── Resource Limits ─────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Environment — ConfigMap ──────────────────────────────────
          envFrom:
            - configMapRef:
                name: raphragrance-config
            - secretRef:
                name: raphragrance-secrets

          # ── Liveness Probe (no external deps) ───────────────────────
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness Probe (local state only) ──────────────────────
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Startup Probe ────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 60s total start window

      # ── Graceful termination ─────────────────────────────────────────
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
