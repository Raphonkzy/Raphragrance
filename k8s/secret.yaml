# ─────────────────────────────────────────────────────────────────────────────
# Raphragrance: Secret Template
# Replace the placeholder value with your actual base64-encoded API key:
#   echo -n "your_fragella_api_key" | base64
# Then apply: kubectl apply -f k8s/secret.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: raphragrance-secrets
  namespace: default
  labels:
    app: raphragrance
    app.kubernetes.io/name: raphragrance
    app.kubernetes.io/component: secret
type: Opaque
data:
  # Replace with: echo -n "your_actual_fragella_api_key" | base64
  FRAGELLA_API_KEY: "REPLACE_WITH_BASE64_ENCODED_API_KEY"
