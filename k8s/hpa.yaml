apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: raphragrance-hpa
  namespace: default
  labels:
    app: raphragrance
    app.kubernetes.io/name: raphragrance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: raphragrance
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
