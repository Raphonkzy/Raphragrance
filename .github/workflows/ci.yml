name: CI Pipeline

on:
  push:
    branches: [master, main, development]
  pull_request:
    branches: [master, main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test, Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Gilroy Fonts Presence
        run: node scripts/check-fonts.js
        env:
          ALLOW_FALLBACK_FONT: 'true'

      - name: Verify Build Safety (Data Isolation)
        run: node scripts/verify-build-safety.js

      - name: Verify Palette Contrast (WCAG 2.1 AA)
        run: node scripts/verify-palette.js

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Next.js Linting
        run: npm run lint

      - name: Run Unit & Safety Tests
        run: |
          node --test tests/curated_loader.test.js
          node --test tests/data_safety.test.js

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          ALLOW_FALLBACK_FONT: 'true'

      - name: Start Production Server
        run: |
          npm run start &
          sleep 5

      - name: Run E2E Tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000
