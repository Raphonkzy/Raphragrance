<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raphragrance — design preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#000;font:14px system-ui,sans-serif}
a{color:inherit;text-decoration:none}

/* control bar (not part of the design) */
.ctl{position:sticky;top:0;z-index:50;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:#111;color:#ddd;font:12px system-ui;height:44px;overflow:hidden}
.ctl button{background:#222;color:#ddd;border:1px solid #444;padding:5px 10px;border-radius:4px;cursor:pointer;font:inherit}
.ctl button.on{background:#eee;color:#111;border-color:#eee}
.ctl .sep{width:1px;height:18px;background:#444;margin:0 6px}
.ctl small{opacity:.55;margin-left:auto}

.stage{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:calc(100vh - 44px);font-size:15px;line-height:1.5}
.ph{aspect-ratio:3/4;display:grid;place-items:center;background:color-mix(in srgb,hsl(var(--h) 45% 50%) 14%,var(--sf))}
.ph svg{width:34%;fill:hsl(var(--h) 35% 45%);opacity:.55}
.card{cursor:pointer}
.back{display:inline-block;margin-bottom:20px;cursor:pointer;color:var(--tx2);font-size:13px}
.pyr{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.pn{display:grid;grid-template-rows:repeat(3,80px)}
.pn>div{display:flex;flex-direction:column;justify-content:center;font-size:14px}
.pn small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}

/* ============ 1 · PAPIER ============ */
.d1{--bg:#F5F2EC;--sf:#FDFAF5;--bd:#DDD8CE;--tx:#1A1916;--tx2:#6B6358;--ac:#2C5F3E;--ac2:#7C3A1E;--fd:'Playfair Display',serif;--fb:'DM Sans',sans-serif}
.d1[data-theme=dark]{--bg:#1A1916;--sf:#221F1C;--bd:#333028;--tx:#EDE8DF;--tx2:#9C9488;--ac:#4A8C64;--ac2:#C4623A}
.d1 .nav{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-bottom:1px solid var(--bd)}
.d1 .logo{font:600 22px var(--fd)}
.d1 .kbd{font-size:12px;color:var(--tx2);border:1px solid var(--bd);padding:4px 10px;border-radius:3px}
.d1 h1{font:400 clamp(40px,7vw,96px)/1 var(--fd);padding:56px 40px 36px;letter-spacing:-.02em}
.d1 h1 em{color:var(--ac)}
.d1 .tick{overflow:hidden;white-space:nowrap;border-block:1px solid var(--bd);padding:10px 0;color:var(--tx2);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.d1 .tick span{display:inline-block;padding-left:100%;animation:tk 40s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.d1 .tick span{animation:none;padding-left:40px}}
.d1 .grid{display:grid;grid-template-columns:repeat(6,1fr);column-gap:40px;padding:0 40px 60px}
.d1 .card{padding:28px 0;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.d1 .br{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx2)}
.d1 .nm{font:400 34px/1.1 var(--fd);display:inline;background:linear-gradient(var(--tx),var(--tx)) 0 100%/0 1px no-repeat;transition:background-size .3s;align-self:flex-start}
.d1 .card:hover .nm{background-size:100% 1px}
.d1 .ac{color:var(--tx2);font-size:14px}
.d1 .mt{font-size:13px;color:var(--ac2)}
.d1 .det{display:grid;grid-template-columns:4fr 6fr}
.d1 .det .ph{aspect-ratio:auto;position:sticky;top:44px;height:calc(100vh - 44px)}
.d1 .info{padding:48px 56px 80px}
.d1 .info h2{font:400 clamp(40px,5vw,72px)/1.05 var(--fd);margin:8px 0 12px}
.d1 .info h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);margin:36px 0 12px;font-weight:500}
.d1 .rule>div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}
.d1 .rule b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--ac)}
.d1 .perf{color:var(--tx2)}

/* ============ 2 · LABORATOIRE ============ */
.d2{--bg:#F0F0EE;--sf:#FFFFFF;--bd:#CDCDC8;--tx:#0F0F0D;--tx2:#5C5C58;--ac:#0055CC;--ac2:#CC3300;--fd:'Instrument Serif',serif;--fb:'IBM Plex Sans',sans-serif;--fm:'IBM Plex Mono',monospace}
.d2[data-theme=dark]{--bg:#0F0F0D;--sf:#161614;--bd:#2A2A26;--tx:#E8E8E4;--tx2:#888884;--ac:#4D8FFF;--ac2:#FF6644}
.d2 .nav{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--bd);position:sticky;top:44px;background:var(--bg);z-index:5}
.d2 .logo{font:400 26px var(--fd)}
.d2 .search{flex:1;max-width:520px;padding:8px 12px;border:1px solid var(--bd);background:var(--sf);font:13px var(--fm);color:var(--tx2)}
.d2 .strip{display:flex;gap:24px;padding:10px 20px;border-bottom:1px solid var(--bd);font:12px var(--fm);color:var(--tx2);flex-wrap:wrap}
.d2 .strip b{color:var(--tx);font-weight:500}
.d2 .lay{display:grid;grid-template-columns:200px 1fr}
.d2 .side{border-right:1px solid var(--bd);padding:16px 20px;font-size:13px;display:flex;flex-direction:column;gap:18px}
.d2 .side h4{font:500 11px var(--fm);text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);margin-bottom:6px}
.d2 .side label{display:block;padding:2px 0}
.d2 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;background:var(--bd);align-content:start}
.d2 .card{background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:7px}
.d2 .card:hover{background:var(--sf)}
.d2 .nm{font:400 22px/1.1 var(--fd)}
.d2 .br{font:12px var(--fm);color:var(--tx2)}
.d2 .seg{display:flex;height:6px;gap:1px}
.d2 .seg i{display:block}
.d2 .mt{display:flex;justify-content:space-between;font:12px var(--fm)}
.d2 .det{display:grid;grid-template-columns:1fr 1fr}
.d2 .pan{padding:20px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:26px}
.d2 .pan2{padding:20px;display:flex;flex-direction:column;gap:22px}
.d2 h2{font:400 44px/1 var(--fd)}
.d2 h3{font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px}
.d2 .stack{display:flex;height:30px;margin-bottom:10px}
.d2 .stack i{display:block}
.d2 table{width:100%;border-collapse:collapse;font:13px var(--fm)}
.d2 td,.d2 th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;font-weight:400}
.d2 th{color:var(--tx2);font-size:11px;text-transform:uppercase}
.d2 td.n{text-align:right;font-variant-numeric:tabular-nums}
.d2 .sw{display:inline-block;width:9px;height:9px;margin-right:8px}
.d2 .gg{margin-bottom:12px}
.d2 .trk{height:4px;background:var(--bd);margin-top:6px}
.d2 .trk i{display:block;height:100%;background:var(--ac)}
.d2 .ph{max-width:260px}

/* ============ 3 · DISTILLERIE ============ */
.d3{--bg:#FDFBF8;--sf:#F7F5F0;--bd:#E0DCD4;--tx:#1C1A17;--tx2:#6E6861;--ac:#5B3A8C;--ac2:#8C5530;--fd:'Fraunces',serif;--fb:'Plus Jakarta Sans',sans-serif}
.d3[data-theme=dark]{--bg:#131210;--sf:#1D1B18;--bd:#2E2B26;--tx:#EAE6DF;--tx2:#9E9890;--ac:#9B6FD4;--ac2:#C4824A}
.d3 .nav{display:flex;gap:36px;align-items:baseline;padding:22px 48px}
.d3 .logo{font:400 26px var(--fd)}
.d3 .nav nav{display:flex;gap:22px;color:var(--tx2);font-size:14px}
.d3 .feat{display:grid;grid-template-columns:1fr 1fr;min-height:60vh;border-block:1px solid var(--bd)}
.d3 .feat .ph{aspect-ratio:auto}
.d3 .feat .tx{padding:64px 56px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.d3 .feat h2{font:400 clamp(44px,6vw,88px)/1 var(--fd)}
.d3 .br{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2)}
.d3 .rl{height:1px;background:var(--ac);width:2.5rem;transition:width .35s ease}
.d3 .card:hover .rl{width:100%}
.d3 .srch{padding:28px 48px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.d3 .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:56px 40px;padding:56px 48px 90px}
.d3 .card{display:flex;flex-direction:column;gap:10px}
.d3 .card .nm{font:400 32px/1.1 var(--fd)}
.d3 .ac{font-size:13px;color:var(--tx2)}
.d3 .det{display:grid;grid-template-columns:1fr 1fr}
.d3 .det .ph{aspect-ratio:auto;position:sticky;top:44px;height:calc(100vh - 44px)}
.d3 .info{padding:56px 56px 90px}
.d3 .info h2{font:400 clamp(44px,5vw,76px)/1.02 var(--fd);margin:6px 0 16px}
.d3 .info h3{font:500 11px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);margin:44px 0 14px}
.d3 .bar{display:grid;grid-template-columns:110px 1fr 44px;gap:12px;align-items:center;margin:10px 0;font-size:14px}
.d3 .bar i{height:14px;background:var(--sf);position:relative}
.d3 .bar i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--ac)}
.d3 .bar em{font-style:normal;text-align:right;color:var(--tx2)}
.d3 .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d3 .tile{height:96px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--bd);background:linear-gradient(to top,color-mix(in srgb,var(--ac) 32%,transparent) var(--p),transparent var(--p))}
.d3 .tile small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2)}
.d3 .tile b{font:400 22px var(--fd)}

@media(max-width:820px){
  .d1 .grid{grid-template-columns:1fr;padding:0 20px 40px}.d1 .card{grid-column:auto!important}
  .d1 .nav,.d1 h1{padding-inline:20px}
  .d1 .det,.d2 .det,.d3 .det,.d3 .feat{grid-template-columns:1fr}
  .d1 .det .ph,.d3 .det .ph{position:static;height:auto;aspect-ratio:3/4;max-height:60vh}
  .d1 .info,.d3 .info{padding:28px 20px 60px}
  .d2 .lay{grid-template-columns:1fr}.d2 .side{display:none}
  .d3 .cards{grid-template-columns:1fr;padding:32px 20px}.d3 .nav,.d3 .srch{padding-inline:20px}
  .d3 .feat .tx{padding:32px 20px}
}
</style>
</head>
<body>
<div class="ctl">
  <button data-d="1">1 · Papier</button><button data-d="2">2 · Laboratoire</button><button data-d="3">3 · Distillerie</button>
  <span class="sep"></span>
  <button data-t="light">Light</button><button data-t="dark">Dark</button>
  <span class="sep"></span>
  <button data-v="catalog">Catalog</button><button data-v="detail">Detail</button>
  <small>Layout preview only. Sample data is illustrative, bottles are placeholders. Click a card to open its detail.</small>
</div>
<div id="stage" class="stage"></div>

<script>
const F=[
 {name:'Sauvage',brand:'Dior',year:2015,g:'Men',r:4.22,v:28431,h:215,lon:3.6,sil:3.8,s:[2.4,3.0,4.0,3.1],
  acc:[['fresh spicy',100],['amber',86],['citrus',72],['aromatic',64],['woody',55]],
  top:['Bergamot','Pepper'],heart:['Sichuan Pepper','Lavender','Elemi'],base:['Ambroxan','Cedar','Labdanum']},
 {name:'Santal 33',brand:'Le Labo',year:2011,g:'Unisex',r:4.05,v:12980,h:30,lon:3.9,sil:3.2,s:[3.8,2.6,1.5,3.4],
  acc:[['woody',100],['warm spicy',82],['leather',70],['powdery',58],['aromatic',45]],
  top:['Cardamom','Iris','Violet'],heart:['Sandalwood','Papyrus','Cedar'],base:['Leather','Amber','Musk']},
 {name:'Baccarat Rouge 540',brand:'Maison Francis Kurkdjian',year:2015,g:'Unisex',r:4.31,v:9120,h:350,lon:4.4,sil:4.0,s:[3.6,2.8,2.2,3.7],
  acc:[['amber',100],['woody',88],['sweet',74],['floral',60],['musky',52]],
  top:['Saffron','Jasmine'],heart:['Amberwood','Ambergris'],base:['Fir Resin','Cedar']},
 {name:'Black Opium',brand:'Yves Saint Laurent',year:2014,g:'Women',r:3.98,v:17644,h:280,lon:3.4,sil:3.6,s:[3.9,2.2,1.4,3.6],
  acc:[['vanilla',100],['sweet',90],['coffee',74],['warm spicy',66],['white floral',60]],
  top:['Pear','Pink Pepper','Orange Blossom'],heart:['Coffee','Jasmine','Bitter Almond'],base:['Vanilla','Patchouli','Cedar']},
 {name:'Aventus',brand:'Creed',year:2010,g:'Men',r:4.28,v:21300,h:140,lon:3.8,sil:3.5,s:[1.8,3.2,4.0,3.0],
  acc:[['fruity',100],['citrus',76],['woody',70],['smoky',60],['musky',48]],
  top:['Pineapple','Bergamot','Apple','Blackcurrant'],heart:['Birch','Patchouli','Jasmine','Rose'],base:['Musk','Oakmoss','Ambergris','Vanilla']},
 {name:'No. 5',brand:'Chanel',year:1921,g:'Women',r:4.05,v:15870,h:55,lon:3.3,sil:2.9,s:[3.0,3.4,2.3,3.2],
  acc:[['aldehydic',100],['powdery',84],['white floral',78],['woody',55],['musky',44]],
  top:['Aldehydes','Bergamot','Lemon','Neroli'],heart:['Jasmine','Rose','Ylang-Ylang','Iris'],base:['Vetiver','Sandalwood','Vanilla','Amber']}
];
const S={d:1,v:'catalog',t:'light',i:0};
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('en-US');
const accStr=(f,n)=>f.acc.slice(0,n).map(a=>a[0]).join(' · ');
const lonL=v=>v>=4?'Eternal':v>=3?'Long Lasting':v>=2?'Moderate':'Weak';
const silL=v=>v>=3.5?'Enormous':v>=2.5?'Strong':v>=1.8?'Moderate':'Intimate';

function ph(f){
  return `<div class="ph" style="--h:${f.h}"><svg viewBox="0 0 60 90" aria-hidden="true"><rect x="22" y="4" width="16" height="10" rx="2"/><rect x="26" y="14" width="8" height="8"/><rect x="10" y="22" width="40" height="62" rx="8"/></svg></div>`;
}
function pyr(f,mode){
  const rows=[['Top',f.top],['Heart',f.heart],['Base',f.base]];
  const line=mode==='line';
  const fill=line?['none','none','none']:['color-mix(in srgb,var(--ac) 30%,var(--bg))','color-mix(in srgb,var(--ac) 55%,var(--bg))','var(--ac)'];
  const polys=['120,0 160,80 80,80','80,80 160,80 200,160 40,160','40,160 200,160 240,240 0,240'];
  const svg=polys.map((p,i)=>`<polygon points="${p}" fill="${fill[i]}" stroke="${line?'var(--tx)':'var(--bg)'}" stroke-width="${line?1:3}"/>`).join('');
  const txt=rows.map(r=>`<div><small>${r[0]}</small><span>${r[1].join(', ')}</span></div>`).join('');
  return `<div class="pyr"><svg viewBox="0 0 240 240" width="240" height="240" aria-hidden="true">${svg}</svg><div class="pn">${txt}</div></div>`;
}
function radar(s){
  const c=90,R=70,ang=i=>-Math.PI/2+i*Math.PI/2;
  const pt=(i,k)=>[c+R*k*Math.cos(ang(i)),c+R*k*Math.sin(ang(i))].map(n=>n.toFixed(1)).join(',');
  const grid=[.25,.5,.75,1].map(k=>`<polygon points="${[0,1,2,3].map(i=>pt(i,k)).join(' ')}" fill="none" stroke="var(--bd)"/>`).join('');
  const shape=s.map((v,i)=>pt(i,v/4)).join(' ');
  return `<svg viewBox="0 0 180 180" width="220" height="220" role="img" aria-label="Season suitability">${grid}<polygon points="${shape}" fill="var(--ac)" fill-opacity=".25" stroke="var(--ac)" stroke-width="1.5"/><g font-size="9" fill="var(--tx2)" text-anchor="middle" style="font-family:var(--fm)"><text x="90" y="10">WINTER</text><text x="166" y="93">SPRING</text><text x="90" y="178">SUMMER</text><text x="18" y="93">FALL</text></g></svg>`;
}
function gauge(l,v,t){
  return `<div class="gg"><div class="mt"><span>${l}</span><b>${v.toFixed(1)} / 5.0 · ${t}</b></div><div class="trk"><i style="width:${v/5*100}%"></i></div></div>`;
}

/* ---------- 1 · Papier ---------- */
function r1(){
  const nav=`<header class="nav"><span class="logo">Raphragrance</span><span class="kbd">Search &nbsp;Ctrl K</span></header>`;
  if(S.v==='detail'){
    const f=F[S.i];
    return nav+`<div class="det">${ph(f)}<div class="info">
      <a class="back" onclick="setV('catalog')">← All fragrances</a>
      <div class="br" style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx2)">${f.brand}</div>
      <h2>${f.name}</h2>
      <p class="perf">${f.year} · ${f.g} · rated ${f.r.toFixed(2)} by ${fmt(f.v)} people</p>
      <h3>Main accords</h3>
      <div class="rule">${f.acc.map(a=>`<div><span>${a[0]}</span><b>${a[1]}%</b></div>`).join('')}</div>
      <h3>Note pyramid</h3>${pyr(f,'line')}
      <h3>Performance</h3>
      <p class="perf">Longevity ${f.lon.toFixed(1)}, ${lonL(f.lon).toLowerCase()}. Sillage ${f.sil.toFixed(1)}, ${silL(f.sil).toLowerCase()}.</p>
    </div></div>`;
  }
  const spans=[4,2,2,4,3,3];
  const ticker=F.map(f=>f.brand+' '+f.name).join('  ·  ');
  return nav+`<h1>131,930 fragrances,<br>indexed like a<br><em>reference book.</em></h1>
    <div class="tick"><span>${ticker}  ·  ${ticker}</span></div>
    <div class="grid">${F.map((f,i)=>`<article class="card" style="grid-column:span ${spans[i%6]}" onclick="pick(${i})">
      <div class="br">${f.brand}</div><div><span class="nm">${f.name}</span></div>
      <p class="ac">${accStr(f,3)}</p><p class="mt">${f.r.toFixed(2)} / 5 · ${f.year}</p></article>`).join('')}</div>`;
}

/* ---------- 2 · Laboratoire ---------- */
const hue=(i)=>`hsl(215 65% ${28+i*10}%)`;
function r2(){
  const nav=`<header class="nav"><span class="logo">Raphragrance</span><div class="search">Search brand, note, accord…</div></header>`;
  if(S.v==='detail'){
    const f=F[S.i];
    const max=Math.max(f.top.length,f.heart.length,f.base.length);
    let rows='';for(let k=0;k<max;k++)rows+=`<tr><td>${f.top[k]||''}</td><td>${f.heart[k]||''}</td><td>${f.base[k]||''}</td></tr>`;
    return nav+`<div class="det"><div class="pan">
      <a class="back" onclick="setV('catalog')" style="margin:0">← All fragrances</a>
      <div><h3>Accords</h3>
        <div class="stack">${f.acc.map((a,i)=>`<i style="flex:${a[1]};background:${hue(i)}" title="${a[0]}"></i>`).join('')}</div>
        <table>${f.acc.map((a,i)=>`<tr><td><span class="sw" style="background:${hue(i)}"></span>${a[0]}</td><td class="n">${a[1]}%</td></tr>`).join('')}</table></div>
      <div><h3>Season</h3>${radar(f.s)}</div>
      <div><h3>Performance</h3>${gauge('Longevity',f.lon,lonL(f.lon))}${gauge('Sillage',f.sil,silL(f.sil))}</div>
    </div><div class="pan2">
      <div><h2>${f.name}</h2><p class="br" style="font:13px var(--fm);color:var(--tx2)">${f.brand} · ${f.year} · ${f.g} · ${f.r.toFixed(2)} (${fmt(f.v)} votes)</p></div>
      ${ph(f)}
      <div><h3>Notes</h3><table><tr><th>Top</th><th>Heart</th><th>Base</th></tr>${rows}</table></div>
    </div></div>`;
  }
  const checks=l=>l.map(x=>`<label><input type="checkbox"> ${x}</label>`).join('');
  return nav+`<div class="strip"><span><b>131,930</b> fragrances</span><span>showing <b>${F.length}</b> sample rows</span><span>sort: <b>popularity ↓</b></span></div>
   <div class="lay"><aside class="side">
     <div><h4>Gender</h4>${checks(['Men','Women','Unisex'])}</div>
     <div><h4>Sort</h4>${checks(['Popularity','Rating','Year','Name'])}</div>
     <div><h4>Accords</h4>${checks(['woody','amber','citrus','floral','vanilla'])}</div>
   </aside><div class="grid">${F.map((f,i)=>`<article class="card" onclick="pick(${i})">
      ${ph(f)}<div class="nm">${f.name}</div><div class="br">${f.brand}</div>
      <div class="seg">${f.acc.map((a,k)=>`<i style="flex:${a[1]};background:${hue(k)}"></i>`).join('')}</div>
      <div class="mt"><span>${f.r.toFixed(2)}</span><span>${f.year}</span></div></article>`).join('')}</div></div>`;
}

/* ---------- 3 · Distillerie ---------- */
function r3(){
  const nav=`<header class="nav"><span class="logo">Raphragrance</span><nav><a>Catalog</a><a>Notes</a><a>Brands</a></nav></header>`;
  if(S.v==='detail'){
    const f=F[S.i];
    const ss=['Winter','Spring','Summer','Fall'];
    return nav+`<div class="det">${ph(f)}<div class="info">
      <a class="back" onclick="setV('catalog')">← All fragrances</a>
      <div class="br">${f.brand}</div><h2>${f.name}</h2><div class="rl" style="width:2.5rem"></div>
      <p style="color:var(--tx2);margin-top:14px">${f.year} · ${f.g} · rated ${f.r.toFixed(2)} by ${fmt(f.v)} people</p>
      <h3>Note pyramid</h3>${pyr(f,'fill')}
      <h3>Main accords</h3>${f.acc.map(a=>`<div class="bar"><span>${a[0]}</span><i style="--w:${a[1]}%"></i><em>${a[1]}%</em></div>`).join('')}
      <h3>Season</h3><div class="tiles">${ss.map((n,k)=>`<div class="tile" style="--p:${f.s[k]/4*100}%"><small>${n}</small><b>${f.s[k].toFixed(1)}</b></div>`).join('')}</div>
      <h3>Performance</h3><p style="color:var(--tx2)">Longevity ${f.lon.toFixed(1)}, ${lonL(f.lon).toLowerCase()}. Sillage ${f.sil.toFixed(1)}, ${silL(f.sil).toLowerCase()}.</p>
    </div></div>`;
  }
  const f0=F[0];
  return nav+`<section class="feat card" onclick="pick(0)">${ph(f0)}<div class="tx">
      <div class="br">${f0.brand} · most voted</div><h2>${f0.name}</h2><div class="rl"></div>
      <p class="ac">${accStr(f0,4)}</p><p style="color:var(--ac2)">${f0.r.toFixed(2)} / 5 from ${fmt(f0.v)} votes</p></div></section>
    <div class="srch">Search 131,930 fragrances…</div>
    <div class="cards">${F.slice(1).map((f,j)=>`<article class="card" onclick="pick(${j+1})">${ph(f)}
      <div class="br" style="margin-top:6px">${f.brand}</div><div class="nm">${f.name}</div><div class="rl"></div>
      <p class="ac">${accStr(f,3)}</p></article>`).join('')}</div>`;
}

/* ---------- state ---------- */
function render(){
  const st=$('#stage');
  st.className='stage d'+S.d;
  st.setAttribute('data-theme',S.t);
  st.innerHTML=[null,r1,r2,r3][S.d]();
  document.querySelectorAll('.ctl button').forEach(b=>{
    const on=(b.dataset.d&&+b.dataset.d===S.d)||(b.dataset.t&&b.dataset.t===S.t)||(b.dataset.v&&b.dataset.v===S.v);
    b.classList.toggle('on',!!on);
  });
}
function pick(i){S.i=i;S.v='detail';render();scrollTo(0,0)}
function setV(v){S.v=v;render();scrollTo(0,0)}
document.querySelectorAll('.ctl button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.d)S.d=+b.dataset.d;
  if(b.dataset.t)S.t=b.dataset.t;
  if(b.dataset.v)S.v=b.dataset.v;
  render();scrollTo(0,0);
}));
render();
</script>
</body>
</html>
