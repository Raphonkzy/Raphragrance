services:
  raphragrance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raphragrance
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/perfumes.db
    volumes:
      # Mount the local SQLite database read-only
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
