services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raphragrance-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional PostgreSQL database service (if not using built-in SQLite)
  postgres:
    image: postgres:16-alpine
    container_name: raphragrance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-raphragrance}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-raphragrance}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
